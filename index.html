<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIUPS KUTTIADY - 100 YEARS</title>
<style>
body{font-family:Arial;background:#eef2f7;text-align:center;padding:12px;margin:0;}
.box{background:#fff;max-width:430px;margin:auto;padding:16px;border-radius:16px;box-shadow:0 5px 20px rgba(0,0,0,.15);}
input{width:95%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;}
button{width:95%;padding:13px;border:none;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer;}
#btn1{background:#0d47a1;color:#fff;} #btn2{background:#138808;color:#fff;}
canvas{width:100%;height:auto;display:block;margin-top:12px;border-radius:12px;background:#fff;}
</style>
</head>
<body>
<div class="box">
<h3 style="color:#0d47a1;">MIUPS KUTTIADY - 100 YEARS</h3>
<input type="file" id="photo" accept="image/*">
<input type="text" id="name" placeholder="Name - ഉദാ: Sahad K">
<input type="text" id="classDiv" placeholder="Class - ഉദാ: 5F">
<button id="btn1" onclick="draw()">Preview കാണുക</button>
<button id="btn2" onclick="downloadImg()">Download ചെയ്യുക</button>
<canvas id="c" width="1080" height="1920"></canvas>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const bg=new Image(); bg.src='bg.jpg'; let userImg=null;
bg.onload=()=>draw();

document.getElementById('photo').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  userImg=new Image(); userImg.onload=()=>draw(); userImg.src=URL.createObjectURL(f);
});
document.getElementById('name').addEventListener('input', draw);
document.getElementById('classDiv').addEventListener('input', draw);

function draw(){
  // Background - No Stretch
  ctx.drawImage(bg,0,0,1080,1920);

  // ===== PHOTO POSITION - CORRECT WHITE AREA =====
  // വലത് വശത്തെ വെള്ള ഭാഗത്ത്, വലിവില്ലാതെ
  const px=650, py=700, pw=360, ph=460;

  if(userImg){
    ctx.save();
    ctx.beginPath();
    const r=14;
    ctx.moveTo(px+r,py); ctx.lineTo(px+pw-r,py); ctx.quadraticCurveTo(px+pw,py,px+pw,py+r);
    ctx.lineTo(px+pw,py+ph-r); ctx.quadraticCurveTo(px+pw,py+ph,px+pw-r,py+ph);
    ctx.lineTo(px+r,py+ph); ctx.quadraticCurveTo(px,py+ph,px,py+ph-r);
    ctx.lineTo(px,py+r); ctx.quadraticCurveTo(px,py,px+r,py);
    ctx.closePath();
    ctx.clip();
    // Cover - ഫോട്ടോ വലിയാതെ
    let s=Math.max(pw/userImg.width, ph/userImg.height);
    let w=userImg.width*s, h=userImg.height*s;
    ctx.drawImage(userImg, px+(pw-w)/2, py+(ph-h)/2, w, h);
    ctx.restore();
  }

  // Text - Photo-യുടെ തൊട്ട് താഴെ
  const cx=px+pw/2;
  ctx.textAlign="center";
  ctx.fillStyle="#000000";
  ctx.font="bold 38px Arial";
  ctx.fillText(document.getElementById('name').value, cx, py+ph+55);
  ctx.font="600 30px Arial";
  ctx.fillText(document.getElementById('classDiv').value, cx, py+ph+95);
}

function downloadImg(){
  const a=document.createElement('a');
  a.download=(document.getElementById('name').value || 'MIUPS')+'_Poster.png';
  a.href=canvas.toDataURL('image/png'); a.click();
}
</script>
</body>
</html>
