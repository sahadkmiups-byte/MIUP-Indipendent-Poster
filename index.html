<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIUPS Independence Poster</title>
<style>
body{font-family:Arial;background:#eef2f7;text-align:center;padding:12px;margin:0;}
.box{background:#fff;max-width:430px;margin:auto;padding:18px;border-radius:16px;box-shadow:0 5px 20px rgba(0,0,0,.15);}
input{width:95%;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #ccc;}
button{width:95%;padding:13px;border:none;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer;}
#btn1{background:#0d47a1;color:#fff;} #btn2{background:#138808;color:#fff;}
canvas{width:100%;margin-top:15px;border-radius:12px;background:#fff;}
</style>
</head>
<body>
<div class="box">
<h3 style="color:#0d47a1;">MIUPS KUTTIADY</h3>
<input type="file" id="photo" accept="image/*">
<input type="text" id="name" placeholder="Name - ഉദാ: Sahad K">
<input type="text" id="classDiv" placeholder="Class / Designation">
<button id="btn1" onclick="draw()">Preview</button>
<button id="btn2" onclick="downloadImg()">Download</button>
<canvas id="c" width="1080" height="1350"></canvas>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const bg=new Image(); bg.src='bg.jpg'; let userImg=null;
bg.onload=()=>draw();
document.getElementById('photo').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  userImg=new Image(); userImg.onload=()=>draw(); userImg.src=URL.createObjectURL(f);
});
document.getElementById('name').addEventListener('input', draw);
document.getElementById('classDiv').addEventListener('input', draw);
function draw(){
  ctx.drawImage(bg,0,0,1080,1350);
  // FIXED POSITION - ഇതാണ് കറക്റ്റ് സ്ഥലം
  const px=685, py=375, pw=255, ph=315;
  if(userImg){
    ctx.save();
    ctx.beginPath();
    // Rounded corner
    const r=12; ctx.moveTo(px+r,py); ctx.arcTo(px+pw,py,px+pw,py+ph,r); ctx.arcTo(px+pw,py+ph,px,py+ph,r); ctx.arcTo(px,py+ph,px,py,r); ctx.arcTo(px,py,px+pw,py,r); ctx.closePath();
    ctx.clip();
    // Cover fit
    let s=Math.max(pw/userImg.width, ph/userImg.height);
    let w=userImg.width*s, h=userImg.height*s;
    ctx.drawImage(userImg, px+(pw-w)/2, py+(ph-h)/2, w, h);
    ctx.restore();
  }
  // Name - ഫോട്ടോയുടെ താഴെ
  ctx.textAlign="center";
  ctx.fillStyle="#000";
  ctx.font="bold 28px Arial";
  ctx.fillText(document.getElementById('name').value, px+pw/2, py+ph+35);
  ctx.font="20px Arial";
  ctx.fillStyle="#333";
  ctx.fillText(document.getElementById('classDiv').value, px+pw/2, py+ph+60);
}
function downloadImg(){
  const a=document.createElement('a');
  a.download=(document.getElementById('name').value || 'MIUPS')+'_Poster.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
